# OpenAPI 2.0 spec for API Gateway. The backend is a private Cloud Run service;
# the gateway calls it with an ID token for the dedicated backend SA.
swagger: "2.0"
info:
  title: example-api
  description: Example API fronting a private Cloud Run service
  version: 1.0.0
schemes:
  - https
produces:
  - application/json
x-google-backend:
  address: https://hello-abc123-nw.a.run.app
  deadline: 30.0
  protocol: h2
# Callers present an API key created in a consumer project (see the module's
# consumers input). Do not add a Google ID token (accounts.google.com) scheme
# as a separate entry under security: entries are alternatives, and any
# service account in any project can mint a Google-signed ID token for an
# arbitrary audience, so it would bypass the API key entirely.
securityDefinitions:
  api_key:
    type: apiKey
    name: x-api-key
    in: header
security:
  - api_key: []
paths:
  /hello:
    get:
      summary: Say hello
      operationId: hello
      responses:
        "200":
          description: A greeting
          schema:
            type: string
  /healthz:
    get:
      summary: Health check (still requires an API key)
      operationId: healthz
      security:
        - api_key: []
      responses:
        "200":
          description: OK
